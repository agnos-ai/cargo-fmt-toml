name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-crate-ci.yml@main
    with:
      crate-name: cargo-fmt-toml
      kind: binary
      force-release: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
